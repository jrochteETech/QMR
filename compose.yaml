services:
  qmr:
    build: .
    image: qmr:latest
    restart: unless-stopped
    pull_policy: never
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-qmr}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-qmr}?sslmode=disable
      ADMIN_NAME: ${ADMIN_NAME:-QMR Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: "8080"
    ports:
      - "${QMR_PORT:-8112}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qmr}
      POSTGRES_USER: ${POSTGRES_USER:-qmr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - qmr-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qmr} -d ${POSTGRES_DB:-qmr}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qmr-data: